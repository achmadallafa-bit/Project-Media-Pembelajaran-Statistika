<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petualangan di Data Café</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf1dc;--ink:#4a3324;--card:#fffaf0;--line:#e3c9a0;--acc:#d9622b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a1f18;--ink:#f6e7d2;--card:#3b2c22;--line:#5a4433}}
:root[data-theme=dark]{--bg:#2a1f18;--ink:#f6e7d2;--card:#3b2c22;--line:#5a4433}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif}
#app{max-width:980px;margin:0 auto;padding:10px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:clamp(18px,4.5vw,28px);margin:4px 0}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:2px 12px;font:inherit;cursor:pointer}
.chip.on{background:#bfe8c4;color:#1d4a2a;border-color:#5aa469}
.tip{font-size:14px;opacity:.8;margin:6px 2px}
.b{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:5px 14px;cursor:pointer;box-shadow:0 3px 0 #94401a}.b:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#scene{container-type:inline-size;position:relative;aspect-ratio:16/9;min-height:300px;border-radius:18px;overflow:hidden;border:4px solid #8b5a2b;user-select:none;
background:linear-gradient(#ffe3b8 0 48%,#b57a45 48% 50%,transparent 50%),repeating-conic-gradient(#ecc99b 0 25%,#dfb281 0 50%) 0 0/8cqw 8cqw}
.win{position:absolute;top:6%;width:13%;height:24%;background:linear-gradient(#9fd8ff,#e9f7ff);border:5px solid #8b5a2b;border-radius:10px 10px 0 0}
.board{position:absolute;left:43%;top:7%;width:14%;padding:4px;background:#2f4a3a;color:#fff;border:5px solid #8b5a2b;border-radius:6px;text-align:center;font-size:2.4cqw}
.ctr{position:absolute;top:59%;height:11%;background:linear-gradient(#a8703d,#8b5a2b);border-top:4px solid #cf9660;border-radius:8px 8px 0 0;z-index:70}
.ctr i{position:absolute;bottom:100%;right:6%;font-style:normal;font-size:4cqw}
.dc{position:absolute;font-size:5cqw;z-index:71}
.actor{position:absolute;width:8%;min-width:40px;transform:translate(-50%,-100%)}
.tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#4a3324;border:2px solid #8b5a2b;border-radius:10px;padding:0 7px;font-size:clamp(9px,1.7cqw,14px);animation:tg 1.6s infinite}
.actor:has(.tag){cursor:pointer}
.ch{display:block;width:100%;overflow:visible}
.mt,.mh,.ms,.mk,.eh,.sw,.tb{display:none}
.talk .mn,.happy .mn,.shock .mn,.think .mn{display:none}
.talk .mt{display:block;transform-origin:30px 41px;animation:tk .22s infinite alternate}
.happy .mh,.happy .eh{display:block}.happy .eyes{display:none}
.shock .ms,.shock .sw{display:block}.shock .eyes{transform:scale(1.35);transform-origin:30px 31px}
.think .mk,.think .tb{display:block}
.bod{transform-origin:30px 88px}.hat{transform-origin:30px 14px}.a1{transform-origin:13px 52px}.a2{transform-origin:47px 52px}
.idle .bod{animation:bob 2.4s ease-in-out infinite}
.i-owner .bod{animation:nod 3s ease-in-out infinite}
.i-barista .bod{animation:sway 2.6s ease-in-out infinite}
.i-chef .a2{animation:stir .5s infinite alternate}.i-chef .hat{animation:hat 2s infinite}
.i-cashier .a1{animation:tap .7s infinite}
.walk .bod{animation:wob .4s infinite alternate}
.walk .l1{animation:lg .4s infinite alternate}.walk .l2{animation:lg .4s infinite alternate-reverse}
.happy .bod{animation:jump .5s 3}
.shock .bod{animation:shk .12s 6}.shock .hat{animation:pop .25s 3}
#dlg{position:absolute;left:3%;right:3%;bottom:3%;z-index:200;background:var(--card);color:var(--ink);border:3px solid #8b5a2b;border-radius:16px;padding:8px 14px;box-shadow:0 5px 0 #0003}
#dlg p{margin:2px 0}
#start{position:absolute;inset:0;z-index:300;background:#2a1f18e6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
#start h2{font-size:clamp(22px,5vw,40px);margin:0}
#pnl{position:fixed;inset:0;z-index:500;background:#000b;display:flex;align-items:center;justify-content:center;padding:8px}
.pn{position:relative;background:var(--card);color:var(--ink);border:4px solid #8b5a2b;border-radius:20px;width:min(760px,100%);max-height:96vh;overflow:auto;padding:12px}
.x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.pt{display:flex;align-items:flex-end;gap:8px;margin-right:22px}
.av{width:70px;flex:none}
.bub{flex:1;background:#fff;color:#4a3324;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-height:64px}
.ex,.hint{border-radius:14px;padding:8px 12px;margin:8px 0}
.ex{background:#e6f7e3;color:#1d4a2a;border:2px solid #5aa469;animation:pop .5s}
.hint{background:#fff3c4;color:#5a4300;border:2px solid #e0b93a}
.cups{display:flex;gap:min(4vw,24px);justify-content:center;padding:16px 4px 4px}
.cw{text-align:center}
.cup{width:66px;height:120px;border:3px solid #7a5a3a;border-top:0;border-radius:0 0 22px 22px;background:#fff9;position:relative;overflow:hidden;cursor:grab;touch-action:none}
.cup::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,transparent 0 10.4px,#0002 10.4px 11.4px)}
.cup.ok{animation:glow 1s infinite alternate}
.liq{position:absolute;bottom:0;left:0;width:100%;background:#6f4e37;transition:height 1s ease}
.liq::before{content:"";position:absolute;top:-5px;left:-15%;width:130%;height:10px;background:#8a6248;border-radius:50%;animation:wv 1.4s linear infinite alternate}
.ghost{cursor:grabbing;filter:drop-shadow(0 8px 6px #0004)}
.stream{position:fixed;width:8px;border-radius:4px;z-index:998;transition:height .35s linear;background:repeating-linear-gradient(180deg,#8a5a3a 0 10px,#6f4e37 10px 18px);animation:fl .2s linear infinite}
.cards{display:flex;gap:min(2.5vw,10px);justify-content:center;padding:18px 0 8px}
.card{width:min(72px,16vw);height:96px;background:#fff;color:#4a3324;border:3px solid #d9622b;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;font-size:22px;line-height:1.1;transition:transform .3s}
.card small{font-size:11px}
.card.no{border-color:#d33;background:#ffe3e3}.card.dim{opacity:.45}
.card.mid{transform:scale(1.18);background:#fff2a8;animation:glow .8s infinite alternate}
.lab{display:flex;justify-content:space-between;font-size:14px;margin:0 6px}
.pile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;min-height:60px;background:#0001;border-radius:12px}
.oc{background:#fff;color:#4a3324;border:2px solid #d9622b;border-radius:10px;padding:2px 6px;cursor:grab;touch-action:none;user-select:none;font-size:13px;width:92px;text-align:center;line-height:1.2}
.trays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tray{border:3px dashed #8b5a2b;border-radius:14px;min-height:130px;padding:6px;text-align:center;background:#fff5}
.tray.win{background:#fff2a8;border-style:solid;animation:glow .8s infinite alternate;color:#4a3324}
.tray.sh{animation:shk .12s 4}
.tray .in{font-size:20px;min-height:28px;word-break:break-all}
.bar{height:10px;background:#0002;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0;background:#d9622b;transition:width .8s}
@keyframes bob{50%{transform:translateY(-2px) scaleY(1.02)}}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-3px)}}
@keyframes lg{to{transform:translateY(-4px)}}
@keyframes jump{50%{transform:translateY(-14px)}}
@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes nod{50%{transform:rotate(2.5deg)}}
@keyframes sway{50%{transform:translateX(3px)}}
@keyframes stir{to{transform:rotate(-28deg)}}
@keyframes tap{50%{transform:rotate(22deg)}}
@keyframes hat{50%{transform:rotate(-6deg)}}
@keyframes pop{50%{transform:translateY(-8px) scale(1.04)}}
@keyframes glow{to{box-shadow:0 0 22px 6px #ffd23f}}
@keyframes tk{to{transform:scaleY(.35)}}
@keyframes wv{to{transform:translateX(12%)}}
@keyframes fl{to{background-position:0 18px}}
@keyframes tg{50%{transform:translateX(-50%) translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.tag,.idle .bod{animation:none}}
</style></head><body><div id="app">
<header><h1>☕ Petualangan di Data Café</h1><div class="row" style="margin:0"><button id="toggleSnd" class="chip on">🔊 Suara</button><button id="toggleMusic" class="chip on">🎵 Musik</button></div></header>
<div class="row" id="chips" style="margin-top:4px"></div>
<div id="scene">
<div class="win" style="left:5%"></div><div class="win" style="left:22%"></div><div class="board">MENU<br>☕ 🥐 🍵</div><div class="win" style="left:80%"></div>
<div class="ctr" style="left:2%;width:27%"><i>🫖☕</i></div><div class="ctr" style="left:37%;width:27%"><i>🍰🎂</i></div><div class="ctr" style="left:71%;width:27%"><i>🧾💰</i></div>
<span class="dc" style="left:0;top:74%">🪴</span><span class="dc" style="right:0;top:74%">🪴</span>
<div id="dlg" hidden></div>
<div id="start"><h2>☕ Petualangan di Data Café</h2><p>Jadilah Detektif Data dan pecahkan tiga misteri data di café yang hangat ini!</p><button class="b" id="go">Mulai petualangan</button></div>
</div>
<p class="tip">Klik Barista, Chef, atau Kasir untuk berjalan ke sana dan mulai misi. Klik lantai untuk berjalan bebas.</p>
</div>
<div id="pnl" hidden></div>
<script>
const $=s=>document.querySelector(s),sk=['#ffd9b3','#f1c27d','#c68642','#8d5524'];
let sndOn=true,musicOn=true,AC=null,musicTimer=null;
function ac(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)())}
function tone(freq,dur=.15,type='sine',vol=.2,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);const t=c.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function beep(...a){if(sndOn)tone(...a)}
function sfxClick(){beep(500,.06,'square',.15)}
function sfxGood(){beep(523,.12,'sine',.2);beep(659,.12,'sine',.2,.12);beep(784,.18,'sine',.22,.24)}
function sfxBad(){beep(200,.18,'sawtooth',.18);beep(160,.22,'sawtooth',.18,.15)}
function noiseBurst(dur=.3,vol=.15,freq=800){try{const c=ac(),n=Math.max(1,Math.floor(c.sampleRate*dur)),buf=c.createBuffer(1,n,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const src=c.createBufferSource();src.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.9;const g=c.createGain();g.gain.value=sndOn?vol:0;src.connect(f);f.connect(g);g.connect(c.destination);src.start()}catch(e){}}
function sfxPour(){if(!sndOn)return;noiseBurst(.4,.12,900);tone(280,.3,'sine',.05,.05)}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>beep(f,.22,'sine',.24,i*.13))}
function startMusic(){if(musicTimer)return;const chords=[[261.6,329.6,392],[293.7,349.2,440],[220,277.2,329.6],[246.9,311.1,392]];let i=0;const tick=()=>{if(!musicOn)return;chords[i%chords.length].forEach((f,j)=>tone(f,3.6,'sine',.045,j*.05));i++};tick();musicTimer=setInterval(tick,4000)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
$('#toggleSnd').onclick=function(){sndOn=!sndOn;this.classList.toggle('on',sndOn);if(!sndOn&&window.speechSynthesis)speechSynthesis.cancel()};
$('#toggleMusic').onclick=function(){musicOn=!musicOn;this.classList.toggle('on',musicOn);if(musicOn)startMusic();else stopMusic()};
document.addEventListener('click',e=>{if(e.target.closest('.b, .chip'))sfxClick()});
const VOICE={owner:{pitch:.9,rate:.95},barista:{pitch:1.15,rate:1.05},chef:{pitch:.8,rate:.95},cashier:{pitch:1.3,rate:1.1},cust:{pitch:1.05,rate:1},me:{pitch:1.2,rate:1.05}};
function pickVoice(id){if(!window.speechSynthesis)return null;const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('id'));if(!vs.length)return null;let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return vs[h%vs.length]}
function speak(html,id){if(!sndOn||!window.speechSynthesis)return;const d=document.createElement('div');d.innerHTML=html;const t=(d.textContent||'').trim();if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';const v=VOICE[id]||{};u.pitch=v.pitch||1;u.rate=v.rate||1;const vv=pickVoice(id||'');if(vv)u.voice=vv;speechSynthesis.speak(u)}
const FN={owner:'Bu Rina (Pemilik Café)',barista:'Barista Bimo',chef:'Chef Cika',cashier:'Kasir Kiki',cust:'Pelanggan'},NM={owner:'Pemilik',barista:'Barista',chef:'Chef',cashier:'Kasir'},T={barista:'mean',chef:'median',cashier:'mode'};
const CON={mean:'☕ <b>Mean</b> (rata-rata) = jumlah semua data ÷ banyak data. Seperti membagi kopi sama rata ke semua gelas.',median:'🎂 <b>Median</b> = nilai tengah dari data yang sudah diurutkan dari terkecil ke terbesar.',mode:'🧾 <b>Modus</b> = data yang paling sering muncul (frekuensi tertinggi).'};
let done={};
const H=c=>`<path d="M11 31q-3-26 19-26t19 26q-5-12-19-12t-19 12z" fill="${c}"/>`;
const CD={
me:{r:'me',b:'#4a90d9',h:H('#2f2118')+'<path d="M12 20q18-15 36 0z" fill="#9a7440"/><rect x="9" y="19" width="42" height="4" rx="2" fill="#6b4f2a"/>',x:'<rect x="36" y="60" width="16" height="15" rx="3" fill="#8b5a2b"/><path d="M15 47l22 20" stroke="#8b5a2b" stroke-width="3"/><rect x="1" y="58" width="13" height="17" rx="2" fill="#3fae7a"/><rect x="3" y="61" width="9" height="2" fill="#fff"/>'},
owner:{r:'owner',b:'#a874c0',h:'<circle cx="30" cy="7" r="7" fill="#d9d9e2"/>'+H('#d9d9e2')+'<circle cx="23" cy="31" r="6.5" fill="none" stroke="#444" stroke-width="1.5"/><circle cx="37" cy="31" r="6.5" fill="none" stroke="#444" stroke-width="1.5"/>',x:'<rect x="20" y="52" width="20" height="26" rx="6" fill="#fff" opacity=".8"/>'},
barista:{r:'barista',b:'#f2e4c9',s:sk[1],h:H('#6b3f2a')+'<rect x="11" y="17" width="38" height="4" rx="2" fill="#3fae7a"/>',x:'<rect x="19" y="52" width="22" height="26" rx="6" fill="#2f7d55"/><rect x="25" y="58" width="10" height="7" rx="2" fill="#1f5a3c"/>'},
chef:{r:'chef',b:'#fff',s:sk[2],h:'<g class="hat"><rect x="17" y="6" width="26" height="14" rx="3" fill="#fff" stroke="#ddd"/><ellipse cx="30" cy="6" rx="15" ry="8" fill="#fff" stroke="#ddd"/></g>',x:'<circle cx="30" cy="56" r="1.8" fill="#bbb"/><circle cx="30" cy="63" r="1.8" fill="#bbb"/><circle cx="30" cy="70" r="1.8" fill="#bbb"/>'},
cashier:{r:'cashier',b:'#d9463e',h:H('#1a1a1a')+'<path d="M11 21q19-13 38 0z" fill="#f0a03c"/>',x:'<path d="M26 47l4 5 4-5z" fill="#fff"/>'},
c0:{r:'cust',b:'#7fb7e6',s:sk[3],h:H('#111')},
c1:{r:'cust',b:'#f4a6c0',s:sk[1],h:H('#e0a030')+'<circle cx="10" cy="26" r="6" fill="#e0a030"/><circle cx="50" cy="26" r="6" fill="#e0a030"/>'},
c2:{r:'cust',b:'#b6d97a',s:sk[0],h:H('#7a4a2a')}};
CD.cust=CD.c1;
function CH(id){const c=CD[id];return `<svg class="ch idle i-${c.r}" data-id="${id}" viewBox="0 0 60 92"><g class="bod"><rect class="l1" x="19" y="74" width="8" height="14" rx="4" fill="#5b4636"/><rect class="l2" x="33" y="74" width="8" height="14" rx="4" fill="#5b4636"/><rect class="a1" x="8" y="50" width="9" height="22" rx="4.5" fill="${c.b}"/><rect class="a2" x="43" y="50" width="9" height="22" rx="4.5" fill="${c.b}"/><rect x="15" y="46" width="30" height="32" rx="11" fill="${c.b}"/>${c.x||''}<circle cx="30" cy="30" r="19" fill="${c.s||sk[0]}"/>${c.h}<g class="eyes"><circle cx="23" cy="31" r="3" fill="#222"/><circle cx="37" cy="31" r="3" fill="#222"/><circle cx="24" cy="30" r="1" fill="#fff"/><circle cx="38" cy="30" r="1" fill="#fff"/></g><path class="eh" d="M19 33q4-7 8 0M33 33q4-7 8 0" stroke="#222" fill="none" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="38" r="3" fill="#ff8f9a" opacity=".55"/><circle cx="44" cy="38" r="3" fill="#ff8f9a" opacity=".55"/><path class="mn" d="M25 40q5 4 10 0" stroke="#7a3b2e" fill="none" stroke-width="2" stroke-linecap="round"/><ellipse class="mt" cx="30" cy="41" rx="4" ry="3.5" fill="#7a3b2e"/><path class="mh" d="M23 38q7 11 14 0z" fill="#7a3b2e"/><ellipse class="ms" cx="30" cy="42" rx="3" ry="5" fill="#7a3b2e"/><path class="mk" d="M26 41h8" stroke="#7a3b2e" stroke-width="2" stroke-linecap="round"/><path class="sw" d="M49 20q4 6 0 9q-4-3 0-9z" fill="#7ec8f7"/><g class="tb"><circle cx="52" cy="9" r="8" fill="#fff" stroke="#999"/><text x="52" y="13" font-size="11" text-anchor="middle" fill="#555">?</text></g></g></svg>`}
function react(id,ex,ms=1500){document.querySelectorAll(`.ch[data-id="${id}"]`).forEach(s=>{s.classList.remove('happy','shock','think','talk');s.classList.add(ex);setTimeout(()=>s.classList.remove(ex),ms)})}
const S=$('#scene'),A={};
function mk(id,x,y,w,tag){const d=document.createElement('div');d.className='actor';d.dataset.id=id;d.style.cssText=`left:${x}%;top:${y}%;z-index:${Math.round(y)};width:${w}%`;d.innerHTML=(tag?`<div class="tag" id="tag-${id}"></div>`:'')+`<div class="fl">${CH(id)}</div>`;S.append(d);return A[id]={el:d,x,y,tm:0,sp:30,f:1}}
function go(a,x,y,cb){const dx=x-a.x,t=Math.max(Math.hypot(dx,y-a.y)/a.sp,.05);if(Math.abs(dx)>.5)a.f=dx<0?-1:1;a.el.querySelector('.fl').style.transform=`scaleX(${a.f})`;const s=a.el.style;s.transition=`left ${t}s linear,top ${t}s linear`;s.left=x+'%';s.top=y+'%';s.zIndex=Math.round(y);a.x=x;a.y=y;const v=a.el.querySelector('svg');v.classList.add('walk');clearTimeout(a.tm);a.tm=setTimeout(()=>{v.classList.remove('walk');cb&&cb()},t*1000+40)}
['owner','barista','chef','cashier'].forEach((k,i)=>mk(k,[40,14,50,84][i],[86,62,62,62][i],8,1));
const me=mk('me',10,92,8.5);
['c0','c1','c2'].forEach((id,i)=>{const a=mk(id,22+i*26,84+i*3,7);a.sp=9;(function l(){go(a,6+Math.random()*88,80+Math.random()*13);setTimeout(l,3500+Math.random()*5000)})()});
function unlocked(id){if(id=='barista'||id=='owner')return true;if(id=='chef')return !!done.mean;if(id=='cashier')return !!done.median;return true}
function tags(){for(const k in NM){const u=unlocked(k);$('#tag-'+k).textContent=NM[k]+(T[k]?(done[T[k]]?' ✓':u?' ❗':' 🔒'):'')}}
function chips(){$('#chips').innerHTML='<span>📖 Buku Data:</span>'+[['mean','☕ Mean'],['median','🎂 Median'],['mode','🧾 Modus']].map(([k,l])=>`<button class="chip${done[k]?' on':''}" data-k="${k}">${l}${done[k]?' ✓':''}</button>`).join('')}
$('#chips').onclick=e=>{const k=e.target.dataset.k;if(!k||busy())return;dlg('owner',done[k]?CON[k]:'Halaman ini masih terkunci. Selesaikan misinya dulu, Detektif!',[['Oke',0]])};
const busy=()=>!$('#dlg').hidden||!$('#pnl').hidden||!$('#start').hidden;

function step2(){say('barista',`Mantap, semua terkumpul jadi <b>${total}</b>! <b>Langkah 2:</b> Seret wadah besar ke tiap gelas kosong untuk membagikannya secara merata.`);const each=total/4;let filled=0;
